<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0e1014">
<title>科三路线通 · 苏州科技城 · 科目三路线顺序记忆训练</title>
<meta name="description" content="苏州科技城科目三路线记忆训练：按线路练顺序，按车型练难点，含夜间灯光模拟。支持 C1 手动挡 / C2 自动挡。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="科三路线通">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0e1014; --panel:#171b22; --panel-2:#1f242d;
    --line:#272e3a; --text:#e9edf3; --dim:#98a3b3; --dim-2:#69737f;
    --accent:#3ddc97; --accent-2:#4da3ff; --warn:#ffb454; --red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#08090c;color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  .stagewrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .stagehint{font-size:12px;color:var(--dim-2);text-align:center;max-width:430px;line-height:1.7}
  .stagehint b{color:var(--accent)}
  .phone{width:390px;height:800px;background:var(--bg);border-radius:42px;border:1px solid #232a35;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.9),0 0 0 9px #14171d,0 0 0 10px #262d38;
    position:relative;overflow:hidden;display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#0b0d11;border-radius:0 0 18px 18px;z-index:60}
  .statusbar{height:42px;flex:0 0 42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 4px;font-size:11.5px;color:var(--dim-2);z-index:50}
  .app{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
  .app::-webkit-scrollbar{display:none}
  .screen{padding:0 20px 96px;animation:in .22s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .nav{display:flex;align-items:center;gap:10px;padding:4px 0 14px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 72%,transparent);z-index:40}
  .back{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim);cursor:pointer}
  .back:active{transform:scale(.94)}
  .navtitle{font-size:14.5px;font-weight:600}
  .navsub{font-size:11px;color:var(--dim-2);margin-top:1px}
  .spacer{flex:1}
  h1{font-size:21px;letter-spacing:-.01em}
  .lead{font-size:12.5px;color:var(--dim-2);margin-top:5px}
  .sechead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2);font-weight:700;margin:22px 0 10px}
  .seg{display:flex;gap:4px;background:var(--panel-2);border-radius:11px;padding:4px;margin:14px 0 2px}
  .segb{flex:1;padding:9px;border-radius:8px;border:none;background:transparent;color:var(--dim-2);
    font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.16s}
  .segb.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .segcap{font-size:10.5px;color:var(--dim-2);text-align:center;margin-top:8px}
  .row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active .rt{color:var(--accent)}
  .rn{font-size:12px;font-weight:700;color:var(--dim-2);width:34px;flex:0 0 34px;letter-spacing:.02em}
  .rt{font-size:14.5px;font-weight:500;flex:1;transition:.15s}
  .rc{font-size:11px;color:var(--dim-2)}
  .arw{color:var(--dim-2);font-size:15px}
  .heroes{display:flex;gap:9px}
  .hero{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
  .hero:active{transform:scale(.98)}
  .hero .ht{font-size:13.5px;font-weight:600;margin-top:10px}
  .hero .hp{font-size:10.5px;color:var(--dim-2);margin-top:3px}
  .hero .ico{font-size:17px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .ico.b{background:rgba(77,163,255,.13)}
  .ico.o{background:rgba(255,180,84,.13)}
  .btn{display:block;width:100%;padding:14px;border-radius:13px;border:none;font-size:14.5px;font-weight:600;
    background:var(--accent);color:#06120c;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.985)}
  .btn:disabled{background:var(--panel-2);color:var(--dim-2)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btnrow{display:flex;gap:9px}
  .btnrow .btn{flex:1}
  .btm{position:sticky;bottom:0;padding:16px 0;background:linear-gradient(0deg,var(--bg) 62%,transparent)}
  .prog{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .prog .bar{flex:1;height:3px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .prog .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .prog span{font-size:10.5px;color:var(--dim-2);letter-spacing:.06em}
  .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);font-weight:700;margin-bottom:8px}
  .pool{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11.5px;padding:6px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);cursor:pointer;user-select:none;transition:.14s;line-height:1.3}
  .chip:active{transform:scale(.94)}
  .poolstick{position:sticky;top:-1px;z-index:30;padding:6px 0 12px;
    background:linear-gradient(180deg,var(--bg) 76%,rgba(14,16,20,.75) 92%,transparent)}
  .navflat{position:static;background:none}
  .applied{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .arow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:var(--panel-2);font-size:12.5px;animation:in .18s ease}
  .arow .n{width:19px;height:19px;flex:0 0 19px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .arow .x{margin-left:auto;color:var(--dim-2);font-size:13px}
  .arow.ok{background:rgba(61,220,151,.09)}
  .arow.ok .n{background:rgba(61,220,151,.18);color:var(--accent)}
  .arow.bad{background:rgba(255,107,107,.08)}
  .arow.bad .n{background:rgba(255,107,107,.18);color:var(--red)}
  .arow .fix{font-size:10.5px;color:var(--warn);margin-left:auto;text-align:right;max-width:46%}
  .empty{font-size:11.5px;color:var(--dim-2);padding:12px 2px}
  .voice{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;margin-bottom:14px}
  .voice .txt{font-size:15.5px;font-weight:600;line-height:1.55}
  .voice .hint{font-size:10.5px;color:var(--dim-2);margin-top:9px}
  .lpanel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lbtn{padding:14px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s}
  .lbtn:active{transform:scale(.96)}
  .lbtn.ok{background:rgba(61,220,151,.13);border-color:rgba(61,220,151,.5);color:var(--accent)}
  .lbtn.bad{background:rgba(255,107,107,.11);border-color:rgba(255,107,107,.45);color:var(--red)}
  .opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:13.5px;font-family:inherit;
    cursor:pointer;margin-bottom:8px;transition:.14s;line-height:1.5}
  .opt:active{transform:scale(.985)}
  .opt .k{width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:var(--panel-2);color:var(--dim);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .opt.ok{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.45)}
  .opt.ok .k{background:rgba(61,220,151,.2);color:var(--accent)}
  .opt.bad{background:rgba(255,107,107,.09);border-color:rgba(255,107,107,.4)}
  .opt.bad .k{background:rgba(255,107,107,.2);color:var(--red)}
  .expl{margin-top:12px;padding:12px 14px;border-radius:11px;font-size:12px;line-height:1.65;color:var(--dim);background:var(--panel)}
  .expl b{color:var(--accent)}
  .expl.warn b{color:var(--red)}
  .score{text-align:center;padding:22px 0 4px}
  .score .big{font-size:46px;font-weight:800;line-height:1;color:var(--accent)}
  .score .lab{font-size:12px;color:var(--dim-2);margin-top:9px}
  .stat{display:flex;margin:18px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stat .s{flex:1;padding:12px;text-align:center;border-right:1px solid var(--line)}
  .stat .s:last-child{border-right:none}
  .stat .s b{display:block;font-size:18px;margin-bottom:2px}
  .stat .s span{font-size:10.5px;color:var(--dim-2)}
  /* 速查：可展开 */
  .tli{border-bottom:1px solid var(--line)}
  .tli:last-child{border-bottom:none}
  .ti{display:flex;align-items:center;gap:11px;padding:11px 0;cursor:pointer}
  .ti .num{font-size:10.5px;color:var(--dim-2);width:22px;flex:0 0 22px;font-variant-numeric:tabular-nums}
  .ti .nm{font-size:13px;flex:1}
  .ti .nm em{font-style:normal;font-size:9.5px;color:var(--accent-2);border:1px solid rgba(77,163,255,.35);
    border-radius:4px;padding:0 4px;margin-left:6px}
  .ti .chev{color:var(--dim-2);font-size:11px;transition:.2s}
  .ti .cnt{font-size:10.5px;color:var(--dim-2);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .tli.open .ti .chev{transform:rotate(90deg)}
  .ti .dot{width:5px;height:5px;border-radius:50%;background:var(--dim-2);flex:0 0 5px}
  .ti .dot.pub{background:var(--accent)}
  .ti .dot.map{background:var(--accent-2)}
  .ti .dot.inf{background:var(--warn)}
  .tipbox{padding:0 0 15px 33px;animation:in .2s ease}
  .tipbox .k{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px}
  .tipbox .v{font-size:10.5px;color:var(--dim-2);margin-bottom:9px;padding-left:9px;border-left:2px solid var(--line)}
  .tipbox .t{font-size:12px;color:var(--dim);line-height:1.7}
  .tipbox .l{font-size:11px;color:var(--warn);line-height:1.6;margin-top:9px}
  .tipbox .nt{font-size:11px;color:var(--accent-2);line-height:1.6;margin-top:7px}
  /* 动作拆解 */
  .steps{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
  .steps .sh{font-size:10px;letter-spacing:.12em;color:var(--dim-2);font-weight:700;margin-bottom:9px}
  .slist{list-style:none;margin:0;padding:0;counter-reset:st}
  .slist li{position:relative;display:flex;align-items:flex-start;gap:8px;
    padding:5px 0 5px 25px;font-size:12px;line-height:1.62;color:var(--dim)}
  .slist li:before{counter-increment:st;content:counter(st);position:absolute;left:0;top:6px;
    width:16px;height:16px;border-radius:5px;background:var(--panel-2);color:var(--dim-2);
    font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums}
  .sk{flex:0 0 auto;font-style:normal;font-size:9.5px;font-weight:700;line-height:16px;
    height:16px;padding:0 5px;border-radius:5px;margin-top:2px}
  .sk.see{background:rgba(77,163,255,.16);color:var(--accent-2)}
  .sk.lamp{background:rgba(255,180,84,.16);color:var(--warn)}
  .sk.hand{background:rgba(61,220,151,.14);color:var(--accent)}
  .sk.speed{background:rgba(180,140,255,.16);color:#b48cff}
  .reftable{margin-top:11px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .reftable .rr{display:flex;justify-content:space-between;gap:10px;font-size:11px;
    padding:6px 10px;border-bottom:1px solid var(--line);color:var(--dim-2)}
  .reftable .rr:last-child{border-bottom:none}
  .reftable .rr span:first-child{color:var(--text);font-weight:600}
  .legend{display:flex;gap:14px;font-size:10.5px;color:var(--dim-2);margin-top:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .sp{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .sp:last-child{border-bottom:none}
  .sp .si{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--dim-2)}
  .sp .st{font-size:13.5px;font-weight:500}
  .sp .ss{font-size:10.5px;color:var(--dim-2);margin-top:3px}
  .sp:active .st{color:var(--accent)}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:62px;background:rgba(14,16,20,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;padding-bottom:8px;z-index:50}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim-2);font-size:10px;cursor:pointer}
  .tab .ti2{font-size:17px;line-height:1}
  .tab.on{color:var(--accent)}
  .toast{position:absolute;left:18px;right:18px;bottom:80px;z-index:80;background:var(--panel-2);border:1px solid var(--line);
    color:var(--dim);font-size:12px;line-height:1.6;padding:12px 14px;border-radius:12px;opacity:0;transform:translateY(8px);
    transition:.22s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .note{font-size:10.5px;color:var(--dim-2);line-height:1.65;margin-top:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  /* 首次使用引导 */
  .guide{background:linear-gradient(135deg,rgba(61,220,151,.1),transparent 70%),var(--panel);
    border:1px solid rgba(61,220,151,.3);border-radius:14px;padding:16px;margin-top:16px}
  .guide .gt{font-size:13.5px;font-weight:600;margin-bottom:9px}
  .guide .gl{font-size:11.5px;color:var(--dim);line-height:1.9}
  .gbtn{margin-top:13px;width:100%;padding:10px;border-radius:10px;border:1px solid rgba(61,220,151,.4);
    background:rgba(61,220,151,.1);color:var(--accent);font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
  .gbtn:active{transform:scale(.97)}
  /* 掌握度 */
  .mline{margin-bottom:15px}
  .mline:last-of-type{margin-bottom:8px}
  .mhead{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .mhead span:last-child{font-variant-numeric:tabular-nums}
  /* 朗读 */
  .sbtn{margin-top:12px;padding:7px 18px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--accent);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
  .sbtn:active{transform:scale(.95)}
  .sayb{color:var(--accent-2);cursor:pointer;border-bottom:1px dashed rgba(77,163,255,.5);margin-left:7px;white-space:nowrap}
  /* 首页练习模式网格 */
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
  .mcard:active{transform:scale(.98)}
  .mcard.hot{border-color:rgba(61,220,151,.35);
    background:linear-gradient(135deg,rgba(61,220,151,.08),transparent 70%),var(--panel)}
  .mcard .ico{font-size:17px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .mcard .ht{font-size:13.5px;font-weight:600;margin-top:10px;display:flex;align-items:center;gap:6px}
  .mcard .hp{font-size:10.5px;color:var(--dim-2);margin-top:3px;line-height:1.5}
  .ico.b{background:rgba(77,163,255,.13)}
  .ico.o{background:rgba(255,180,84,.13)}
  .ico.g{background:rgba(61,220,151,.13);color:var(--accent)}
  /* 跨线路混合 */
  .mh-ico{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:rgba(61,220,151,.14);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent)}
  .fbadge{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px;
    background:rgba(61,220,151,.15);color:var(--accent)}
  /* 情境判断的播报卡 */
  .cue{background:linear-gradient(135deg,rgba(77,163,255,.12),transparent 70%),var(--panel);
    border:1px solid rgba(77,163,255,.3);border-radius:14px;padding:18px 16px;margin-bottom:16px}
  .cue .who{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim-2);font-weight:700}
  .cue .say{font-size:17px;font-weight:600;line-height:1.5;margin-top:9px}
  .ask{font-size:13.5px;color:var(--dim);margin-bottom:12px}
  /* 整场模拟 */
  .examcard{display:flex;align-items:center;gap:13px;margin-top:9px;padding:16px;border-radius:14px;
    background:linear-gradient(135deg,rgba(255,180,84,.1),transparent 70%),var(--panel);
    border:1px solid rgba(255,180,84,.32);cursor:pointer}
  .examcard:active{transform:scale(.985)}
  .exbar{display:flex;gap:6px;margin-bottom:16px}
  .exs{flex:1;text-align:center;font-size:10.5px;padding:7px 4px;border-radius:9px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--dim-2)}
  .exs b{display:block;font-size:11.5px;font-weight:700;margin-bottom:2px;opacity:.55}
  .exs.on{border-color:var(--accent);color:var(--accent);background:rgba(61,220,151,.08)}
  .exs.on b{opacity:1}
  .exs.done{border-color:rgba(61,220,151,.3);color:var(--accent)}
  /* 错题重练 */
  .rvcard{display:flex;align-items:center;gap:13px;margin-top:9px;padding:16px;border-radius:14px;
    background:linear-gradient(135deg,rgba(255,107,107,.1),transparent 70%),var(--panel);
    border:1px solid rgba(255,107,107,.32);cursor:pointer}
  .rvcard:active{transform:scale(.985)}
  .rvcard .mh-ico{background:rgba(255,107,107,.14);color:var(--red)}
  .rvcard .fbadge{background:rgba(255,107,107,.15);color:var(--red)}
  .mlist{display:flex;flex-direction:column;gap:6px}
  .mrow{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line)}
  .mrow .mk{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:5px;
    flex:0 0 auto;margin-top:1px;background:rgba(255,107,107,.13);color:var(--red)}
  .mrow .mt{font-size:12px;line-height:1.5;flex:1}
  .mrow .mm{font-size:10px;color:var(--dim-2);margin-top:3px}
  .mrow .mn{font-size:10px;color:var(--dim-2);flex:0 0 auto;margin-top:2px;font-variant-numeric:tabular-nums}
  .mrow.other{opacity:.5}
  .exs.done b{opacity:.85}
  .segcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .segitem{font-size:14px;font-weight:500;padding:9px 0}
  .segarr{color:var(--dim-2);font-size:11px;line-height:1}
  .mixopts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
  .mopt{padding:16px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    color:var(--text);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.14s}
  .mopt:active{transform:scale(.97)}
  .mopt.ok{background:rgba(61,220,151,.13);border-color:rgba(61,220,151,.5);color:var(--accent)}
  .mopt.bad{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.45);color:var(--red)}
  .cmp{margin-top:12px;padding:12px 14px;border-radius:11px;background:var(--panel);
    font-size:11.5px;line-height:1.7;color:var(--dim)}
  .cmp .ct{color:var(--dim-2);margin-bottom:5px}
  .cmp .cv{color:var(--warn)}
  .fatal{padding:40px 24px;text-align:center;font-size:13px;color:var(--dim);line-height:1.9}
  .fatal b{color:var(--red);display:block;font-size:15px;margin-bottom:10px}
  @media(max-width:520px){
    body{padding:0;align-items:stretch}.stagewrap{gap:0}.stagehint{display:none}
    .phone{width:100%;height:100vh;height:100dvh;border-radius:0;border:none;box-shadow:none}
    .notch,.statusbar{display:none}
    .nav{padding-top:14px}
  }
</style>
</head>
<body>
<div class="stagewrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span>科三路线通</span><span>▮▮▮</span></div>
    <div class="app" id="app"></div>
    <div class="toast" id="toast"></div>
    <div class="tabbar" id="tabbar"></div>
  </div>
  <div class="stagehint">单文件 SPA · 直接点。<br>切到 <b>C1/C2</b> 看项目数与难点专项的变化；「速查」里点项目可看要点。</div>
</div>

<!-- ============ 数据层：内容维护只需改这几个文件 ============ -->
<script src="data/items.js"></script>
<script src="data/routes.js"></script>
<script src="data/special.js"></script>
<script src="data/lights.js"></script>

<script>
/* ============================================================
   应用外壳 —— 这里只放交互逻辑，不放任何业务数据。
   要改内容请编辑 data/ 目录下的文件。
   ============================================================ */
const MODEL_NAME = { c1:'C1 手动挡', c2:'C2 自动挡' };

/* 数据加载失败兜底（例如只拷了 index.html 没拷 data/ 目录） */
(function(){
  const miss = [];
  if(!window.KC3_ITEMS)   miss.push('data/items.js');
  if(!window.KC3_ROUTES)  miss.push('data/routes.js');
  if(!window.KC3_SPECIAL) miss.push('data/special.js');
  if(!window.KC3_LIGHTS)  miss.push('data/lights.js');
  if(miss.length){
    document.getElementById('app').innerHTML =
      '<div class="fatal"><b>数据文件没有加载成功</b>缺少：' + miss.join('、') +
      '<br><br>请确认 <code>data/</code> 目录与 <code>index.html</code> 在同一层，' +
      '并保持这个目录结构一起部署。</div>';
    throw new Error('data files missing: ' + miss.join(','));
  }
})();

const ITEMS   = window.KC3_ITEMS;
const ROUTES  = window.KC3_ROUTES;
const SPECIAL = window.KC3_SPECIAL;
const LIGHTS  = window.KC3_LIGHTS;
const OPS     = window.KC3_LIGHT_OPS;

let S = { tab:'train', screen:'home', model:'c1', r:0, open:null, seen:false, scan:'route',
          Q:null, L:null, sp:0, sq:null, mix:null, sc:null, exam:null, rv:null,
          mistakes:[], stats:{}, total:0 };

/* 本地持久化：SPA 无需后端即可保留进度 */
const LS='kc3.v1';
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LS)||'null'); if(!d) return;
    if(d.model==='c1'||d.model==='c2') S.model=d.model;
    /* 只收结构化错题。早期版本存的是纯文本提示，无法重练，直接丢弃 */
    if(Array.isArray(d.mistakes))
      S.mistakes=d.mistakes.filter(m=>m && typeof m.k==='string').slice(0,MAX_M);
    if(d.stats && typeof d.stats==='object') S.stats=d.stats;
    if(typeof d.total==='number') S.total=d.total;
    if(d.seen) S.seen=true;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({ model:S.model, mistakes:S.mistakes,
    stats:S.stats, total:S.total, seen:S.seen })); }catch(e){}
}

/* 掌握度 = 该线路「最好一次」的顺序题正确率；没练过返回 0 */
function mastery(r){ const st=S.stats[r.id]; return st && st.best ? st.best : 0; }
function runCount(r){ const st=S.stats[r.id]; return st && st.runs ? st.runs : 0; }

/* ============================================================ 错题 */
/* 每条错题保存「重建这道题所需的全部字段」，而不是一句文本摘要。
   这样重练时能原样再考一次；线路数据日后被教练改动，旧错题也不会失效。 */
const MAX_M = 30;

/* 去重键：同一道题错多次只留一条（累计次数），不堆满错题本 */
function mkey(m){
  switch(m.k){
    case 'order':    return `order|${m.model}|${m.group}|${m.pos}`;
    case 'scenario': return `scenario|${m.model}|${m.ri}|${m.cue}`;
    case 'mix':      return `mix|${m.model}|${m.ri}|${m.from}`;
    case 'light':    return `light|${m.scene}`;
    case 'spchoice': return `spchoice|${m.model}|${m.title}`;
    default:         return JSON.stringify(m);
  }
}
function addMistake(e){
  if(!e || !e.k) return;
  const k = mkey(e), i = S.mistakes.findIndex(x => mkey(x) === k);
  if(i > -1){
    const old = S.mistakes[i];
    old.n = (old.n || 1) + 1;
    S.mistakes.splice(i, 1); S.mistakes.unshift(old);
  } else {
    e.n = 1; S.mistakes.unshift(e);
  }
  S.mistakes = S.mistakes.slice(0, MAX_M);
}
function dropMistake(key){
  const i = S.mistakes.findIndex(x => mkey(x) === key);
  if(i > -1) S.mistakes.splice(i, 1);
}
/* 灯光题两车型共用，model 记空串 —— 切了车型依然能重练 */
function reviewable(){
  return S.mistakes.filter(m => m && typeof m.k === 'string'
                            && (m.model === S.model || !m.model));
}

/* 排序类错项 → 单点选择题：「上一步之后该是什么」。
   顺序题与专项排序共用；干扰项取自同一组内的其他项，逼学员区分相邻步骤。 */
function stepMistake(labels, i, group, model){
  const answer = labels[i];
  const cue = i > 0 ? labels[i-1] : '';
  const pool = [];
  const take = skipPrev => labels.forEach((x, j) => {
    if(j === i || x === answer) return;
    if(skipPrev && j === i-1) return;
    if(!pool.includes(x)) pool.push(x);
  });
  take(true);
  if(pool.length < 3) take(false);          /* 步骤少时放宽，保证凑满 4 个选项 */
  const opts = sh([answer, ...sh(pool).slice(0, 3)]);
  return { k:'order', model, group, pos:i, cue, answer, opts, ans:opts.indexOf(answer) };
}
function lightMistake(scene, answer){
  const opts = sh([answer, ...sh(OPS.filter(o => o !== answer)).slice(0, 3)]);
  return { k:'light', model:'', scene, opts, ans:opts.indexOf(answer) };
}

const KIND_LABEL = { order:'顺序', scenario:'情境', mix:'跨线路', light:'灯光', spchoice:'专项' };
const kindLabel = m => KIND_LABEL[m.k] || '练习';
function mistakeText(m){
  switch(m.k){
    case 'order':    return `${m.group} · 第 ${m.pos+1} 步是「${m.answer}」`;
    case 'scenario': return `${m.route}｜「${m.cue}」之后`;
    case 'mix':      return `线路辨认｜${(m.seg && m.seg[0]) || '片段'} → …`;
    case 'light':    return `灯光场景｜${m.scene}`;
    case 'spchoice': return `${m.title}`;
    default:         return '错题';
  }
}

/* 错题 → 可作答的题。全部还原成单选，重练节奏才快 */
const RV_MAX = 12;
function goodMistake(m){
  if(!m || typeof m.k !== 'string') return false;
  /* 跨线路题的选项是四条线路名，出题时才拼，所以不带 opts */
  if(m.k === 'mix') return m.ri >= 0 && m.ri < ROUTES.length && Array.isArray(m.seg) && m.seg.length > 0;
  return Array.isArray(m.opts) && m.opts.length > 1
         && m.ans >= 0 && m.ans < m.opts.length;
}
function buildReview(){
  return reviewable().filter(goodMistake).slice(0, RV_MAX).map(buildReviewQ).filter(Boolean);
}
/* 入口上的数字：total 是错题总数，n 是本轮实际能出的题数 */
function reviewStat(){ return { total: reviewable().length, n: buildReview().length }; }
function buildReviewQ(m){
  if(m.k === 'order') return {
    key:mkey(m), tag:'顺序 · ' + m.group,
    cue:m.cue || '（线路起点）',
    prompt: m.cue ? '「' + m.cue + '」之后，这条线路上接下来是什么？' : '这条线路的第一步是什么？',
    opts:m.opts, ans:m.ans,
    exp:`正确答案是「${m.answer}」——它在 ${m.group} 上是第 ${m.pos+1} 步。` };
  if(m.k === 'scenario') return {
    key:mkey(m), tag:'情境 · ' + m.route, cue:m.cue,
    prompt:'接下来这条线路上会播报什么？', opts:m.opts, ans:m.ans,
    exp:`在 ${m.route} 上，「${m.cue}」之后就是「${m.opts[m.ans]}」。` };
  if(m.k === 'mix'){
    const names = ROUTES.map(r => r.name);
    if(!(m.ri >= 0 && m.ri < names.length)) return null;
    return { key:mkey(m), tag:'跨线路', cue:m.seg.join(' → '),
      prompt:'这段顺序属于哪一条线路？', opts:names, ans:m.ri,
      exp:`这段是 ${names[m.ri]} 的。` };
  }
  if(m.k === 'light') return {
    key:mkey(m), tag:'灯光模拟', cue:m.scene,
    prompt:'听到这个场景，应该怎样操作灯光？', opts:m.opts, ans:m.ans,
    exp:`正确操作是「${m.opts[m.ans]}」。` };
  if(m.k === 'spchoice') return {
    key:mkey(m), tag:'专项 · ' + m.title, cue:'',
    prompt:m.q, opts:m.opts, ans:m.ans, exp:m.tip };
  return null;
}
/* 判分：答对即从错题本移除（闭环），答错留下次再来 */
function judgeReview(i, pick){
  const A = S.rv; if(!A) return null;
  const q = A.list[i]; if(!q || A.log[i] !== undefined) return null;
  A.log[i] = pick;
  const ok = pick === q.ans;
  if(ok){ A.ok++; dropMistake(q.key); }
  return ok;
}

/* 语音朗读：用浏览器内置合成，零依赖。不支持的地方按钮直接不显示 */
const CAN_SPEAK = typeof window!=='undefined' && 'speechSynthesis' in window && !!window.SpeechSynthesisUtterance;
function speak(text){
  if(!CAN_SPEAK || !text) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

const $ = id => document.getElementById(id);
const sh = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
let tT=null;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),3000); }

/* 按车型过滤后的线路项目 —— 位置即顺序，用下标做唯一标识 */
function routeItems(r){
  return r.seq
    .filter(n => !(ITEMS[n.id].c1 && S.model==='c2'))
    .map((n,pos) => ({ pos, id:n.id, src:n.src||'std', tag:n.tag, item:ITEMS[n.id],
                       label: ITEMS[n.id].name + (n.tag ? '（'+n.tag+'）' : '') }));
}

/* ============================================================ 渲染 */
function render(){
  const M={home:vHome,order:vOrder,lights:vLights,scan:vScan,mine:vMine,special:vSpecial,sq:vSQ,mix:vMix,scenario:vScenario,exam:vExam,review:vReview};
  $('app').innerHTML=(M[S.screen]||vHome)();
  $('app').scrollTop=0;
  tabs(); bind(); save();
}
function tabs(){
  const on=['home','scan','mine'].includes(S.screen);
  const tb=$('tabbar');
  if(!on){ tb.style.display='none'; return; }
  tb.style.display='flex';
  tb.innerHTML=[['train','训练','◎'],['scan','速查','≡'],['mine','我的','◔']]
    .map(([k,l,i])=>`<div class="tab ${S.tab===k?'on':''}" data-tab="${k}"><span class="ti2">${i}</span>${l}</div>`).join('');
}

/* ---------- 首页 ---------- */
function vHome(){
  const rs=reviewStat();
  return `<div class="screen">
    <div class="nav"><div><h1>练哪条线？</h1><div class="lead">苏州科技城 · 4 条线路</div></div></div>
    <div class="seg">
      <button class="segb ${S.model==='c1'?'on':''}" data-model="c1">C1 手动挡</button>
      <button class="segb ${S.model==='c2'?'on':''}" data-model="c2">C2 自动挡</button>
    </div>
    <div class="segcap">${S.model==='c1'?'考核 16 项 · 含加减挡位操作':'考核 15 项 · 取消加减挡位操作'}</div>

    ${!S.seen?`<div class="guide">
      <div class="gt">第一次用？三步上手</div>
      <div class="gl">
        1 · 先选车型 —— C1 手动 16 项、C2 自动 15 项，项目数不一样<br>
        2 · 点一条线路，把打乱的项目按<b>真实行驶顺序</b>依次点出来<br>
        3 · 提交后逐项对照，排错的会自动进「我的 · 错题本」
      </div>
      <button class="gbtn" data-act="seen">知道了</button>
    </div>`:''}

    <div class="sechead" style="margin-top:20px">练习模式</div>
    <div class="mgrid">
      <div class="mcard" data-go="lights"><div class="ico b">◐</div>
        <div class="ht">灯光模拟</div><div class="hp">12 组场景 · 抽 5 题</div></div>
      <div class="mcard" data-go="scenario"><div class="ico g">▷</div>
        <div class="ht">情境判断</div><div class="hp">听到播报，接下一步</div></div>
      <div class="mcard" data-go="special"><div class="ico o">⚑</div>
        <div class="ht">难点专项</div><div class="hp">${SPECIAL[S.model].length} 个失分点</div></div>
      <div class="mcard hot" data-go="mix"><div class="ico g">⇄</div>
        <div class="ht">跨线路混合 <span class="fbadge">进阶</span></div>
        <div class="hp">猜这段属于哪条线</div></div>
    </div>

    <div class="examcard" data-go="exam">
      <div class="mh-ico">★</div>
      <div style="flex:1">
        <div class="mh-t">整场模拟</div>
        <div class="mh-p">随机抽一条线 · 灯光 → 顺序 → 情境，一次走完给总分</div>
      </div>
      <div class="arw">›</div>
    </div>

    ${rs.n?`<div class="rvcard" data-go="review">
      <div class="mh-ico">↻</div>
      <div style="flex:1">
        <div class="mh-t">错题重练 <span class="fbadge">${rs.n} 道</span></div>
        <div class="mh-p">${rs.total>rs.n?`本轮 ${rs.n} 道 · 错题本还有 ${rs.total-rs.n} 道`:'练错的题再考一遍 —— 答对即从错题本移除'}</div>
      </div>
      <div class="arw">›</div>
    </div>`:''}

    <div class="sechead">路线顺序训练</div>
    ${ROUTES.map((r,i)=>{
      const n=routeItemsFor(r).length, v=mastery(r), c=runCount(r);
      return `<div class="row" data-r="${i}">
        <div class="rn">${r.no}</div><div class="rt">${r.name}</div>
        <div class="rc">${n} 项${c?` · <span style="color:${v>=80?'var(--accent)':'var(--warn)'}">${v}%</span>`:''}</div>
        <div class="arw">›</div></div>`;
    }).join('')}
  </div>`;
}
function routeItemsFor(r){
  return r.seq.filter(n => !(ITEMS[n.id].c1 && S.model==='c2'));
}

/* ---------- 顺序排序题：一次排完整条线路 ---------- */
function vOrder(){
  const r=ROUTES[S.r], items=routeItems(r);
  if(!S.Q || S.Q.r!==S.r || S.Q.model!==S.model) S.Q = newQ(items);
  const q=S.Q, done=q.judged;
  const pool=q.pool.filter(p=>!q.ans.includes(p));
  const okN=q.ans.filter((p,i)=>p===i).length;

  const rows = q.ans.length ? q.ans.map((p,i)=>{
    const ok = done && p===i;
    return `<div class="arow ${done?(ok?'ok':'bad'):''}" data-un="${p}">
      <div class="n">${done?(ok?'✓':'✕'):i+1}</div>
      <div>${q.items[p].label}</div>
      ${done&&!ok?`<div class="fix">应为 ${q.items[i].label}</div>`:(done?'':'<div class="x">✕</div>')}
    </div>`;}).join('')
    : `<div class="empty">按顺序点选上方项目</div>`;

  return `<div class="screen">
    <div class="nav navflat">
      <div class="back" data-go="home">‹</div>
      <div><div class="navtitle">${r.name} · 顺序</div>
      <div class="navsub">共 ${items.length} 项 · ${MODEL_NAME[S.model]}</div></div>
      <div class="spacer"></div>
      ${done?`<div class="navsub" style="color:var(--accent)">${okN}/${q.items.length}</div>`:''}
    </div>
    ${!done?`<div class="poolstick">
      <div class="prog"><div class="bar"><i style="width:${q.ans.length/q.items.length*100}%"></i></div><span>${q.ans.length}/${q.items.length}</span></div>
      <div class="lbl" style="margin-bottom:7px">待选 ${pool.length}</div>
      <div class="pool">${sh(pool).map(p=>`<div class="chip" data-p="${p}">${q.items[p].label}</div>`).join('')}</div>
    </div>`:''}
    <div class="lbl" style="margin-top:${done?'0':'10px'}">${done?'对照':'你的顺序'}</div>
    <div class="applied">${rows}</div>
    <div class="btm">
      ${done
        ? `<div class="btnrow"><button class="btn ghost" data-act="redo">重排</button>
           <button class="btn" data-go="scan">看要点</button></div>`
        : `<button class="btn" ${q.ans.length!==q.items.length?'disabled':''} data-act="submit">${q.ans.length!==q.items.length?`还差 ${q.items.length-q.ans.length} 项`:'提交'}</button>`}
    </div>
  </div>`;
}
function newQ(items){
  const correct=items.map((_,i)=>i);
  return { r:S.r, model:S.model, items, correct, pool:sh(correct), ans:[], judged:false };
}

/* ---------- 难点专项 ---------- */
function vSpecial(){
  const list=SPECIAL[S.model];
  return `<div class="screen">
    <div class="nav"><div class="back" data-go="home">‹</div>
      <div><div class="navtitle">难点专项</div>
      <div class="navsub">${MODEL_NAME[S.model]} · 按真实失分点组织</div></div></div>
    <div class="note" style="margin:0 0 14px">这些不是路线顺序，而是<b style="color:var(--accent)">该车型最容易丢分的手法</b>。顺序题练记忆，专项练手法。</div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 16px">
      ${list.map((x,i)=>`<div class="sp" data-sp="${i}">
        <div class="si">${x.type==='order'?'排序':'单选'}</div>
        <div style="flex:1"><div class="st">${x.t}</div><div class="ss">${x.s}</div></div>
        <div class="arw">›</div></div>`).join('')}
    </div>
  </div>`;
}

function vSQ(){
  const t=SPECIAL[S.model][S.sp];
  if(!S.sq || S.sq.t!==S.sp || S.sq.model!==S.model)
    S.sq = t.type==='order' ? {t:S.sp,model:S.model,ans:[],judged:false}
                            : {t:S.sp,model:S.model,picked:null};

  const nav=`<div class="nav"><div class="back" data-go="special">‹</div>
    <div><div class="navtitle">${t.t}</div><div class="navsub">${MODEL_NAME[S.model]} · 难点专项</div></div></div>`;

  if(t.type==='order'){
    const q=S.sq, done=q.judged, pool=t.steps.map((_,i)=>i).filter(p=>!q.ans.includes(p));
    const okN=q.ans.filter((p,i)=>p===i).length;
    const rows = q.ans.length ? q.ans.map((p,i)=>{
      const ok=done&&p===i;
      return `<div class="arow ${done?(ok?'ok':'bad'):''}" data-sun="${p}">
        <div class="n">${done?(ok?'✓':'✕'):i+1}</div><div>${t.steps[p]}</div>
        ${done&&!ok?`<div class="fix">应为 ${t.steps[i]}</div>`:(done?'':'<div class="x">✕</div>')}</div>`;
    }).join('') : `<div class="empty">按正确操作顺序点选</div>`;

    return `<div class="screen">${nav}
      <div class="note" style="margin:0 0 16px">${t.s}</div>
      ${!done?`<div class="prog"><div class="bar"><i style="width:${q.ans.length/t.steps.length*100}%"></i></div><span>${q.ans.length}/${t.steps.length}</span></div>
        <div class="lbl">待选</div>
        <div class="pool">${sh(pool).map(p=>`<div class="chip" data-sp2="${p}">${t.steps[p]}</div>`).join('')}</div>`:''}
      <div class="lbl" style="margin-top:${done?'0':'22px'}">${done?'对照':'你的顺序'}</div>
      <div class="applied">${rows}</div>
      ${done?`<div class="expl">${okN===t.steps.length?'<b>顺序完全正确</b>｜':'<b>再看一遍</b>｜'}${t.tip}</div>`:''}
      <div class="btm">${done
        ? `<div class="btnrow"><button class="btn ghost" data-act="sredo">重做</button>
           <button class="btn" data-go="special">返回</button></div>`
        : `<button class="btn" ${q.ans.length!==t.steps.length?'disabled':''} data-act="ssubmit">${q.ans.length!==t.steps.length?`还差 ${t.steps.length-q.ans.length} 步`:'提交'}</button>`}</div>
    </div>`;
  }

  const p=S.sq.picked, done=p!==null, KEYS=['A','B','C','D'];
  return `<div class="screen">${nav}
    <div class="note" style="margin:0 0 16px">${t.s}</div>
    <div style="font-size:15px;font-weight:600;line-height:1.55;margin-bottom:16px">${t.q}</div>
    ${t.opts.map((o,i)=>{
      let c=''; if(done){ if(i===t.a) c='ok'; else if(i===p) c='bad'; }
      return `<button class="opt ${c}" ${done?'disabled':''} data-opt="${i}">
        <span class="k">${KEYS[i]}</span><span>${o}</span></button>`;}).join('')}
    ${done?`<div class="expl ${p===t.a?'':'warn'}">${p===t.a?'<b>答对了</b>':'<b>正确答案：'+KEYS[t.a]+'</b>'}｜${t.tip}</div>
      <div class="btm"><button class="btn ghost" data-act="sredo">再做一次</button></div>`:''}
  </div>`;
}

/* ---------- 速查：可展开看要点与动作拆解 ---------- */
/* steps 的三种写法都能消费：字符串 / { t, k } / { t, c1, c2 } */
function stepOf(s){ return typeof s === 'string' ? { t:s } : (s || { t:'' }); }
function stepList(it){
  if(S.model === 'c1' && it.stepsC1) return it.stepsC1;
  if(S.model === 'c2' && it.stepsC2) return it.stepsC2;
  return it.steps || [];
}
function stepText(s){
  const o = stepOf(s);
  if(S.model === 'c1' && o.c1) return o.c1;
  if(S.model === 'c2' && o.c2) return o.c2;
  return o.t;
}
const STEP_K = { '看':'see', '灯':'lamp', '手':'hand', '速':'speed' };

/* 拆解库的分组顺序 = items.js 里的书写顺序，不额外维护配置 */
function itemGroups(){
  const out = [];
  Object.keys(ITEMS).forEach(id => {
    const g = ITEMS[id].group || '其他';
    if(!out.includes(g)) out.push(g);
  });
  return out;
}
/* 当前车型实际考核的项目 id（C2 排除 C1 专属项） */
function itemIds(){
  return Object.keys(ITEMS).filter(id => !(ITEMS[id].c1 && S.model === 'c2'));
}

function stepBox(it){
  const list = stepList(it);
  if(!list.length) return '';
  return `<div class="steps">
    <div class="sh">动作拆解 · ${list.length} 步</div>
    <ol class="slist">${list.map(s => {
      const o = stepOf(s), k = STEP_K[o.k];
      return `<li>${k ? `<i class="sk ${k}">${o.k}</i>` : ''}<span>${stepText(s)}</span></li>`;
    }).join('')}</ol>
    ${it.ref ? `<div class="reftable">${it.ref.map(row =>
      `<div class="rr"><span>${row[0]}</span><span>${row[1]}</span></div>`).join('')}</div>` : ''}
  </div>`;
}

/* 展开后的正文：口诀 → 播报 → 要点 → 动作拆解 → 扣分点 → 补充 */
function tipBox(it, say){
  return `<div class="tipbox">
    <div class="k">${it.key}</div>
    <div class="v">${it.voice}${say || ''}</div>
    <div class="t">${it.tip}</div>
    ${stepBox(it)}
    <div class="l">⚠ ${it.lose}</div>
    ${it.note ? `<div class="nt">＋ ${it.note}</div>` : ''}
  </div>`;
}

/* 开头三项（上车准备·模拟夜间灯光·起步）四条线路完全一样，
   出题时跳过它们——否则题目毫无区分度。 */
const COMMON_HEAD = 3;

/* ---------- 情境判断：听到这句播报，下一步该是什么 ---------- */
/* 干扰项取自「同一条线路的其他项」——逼学员区分相邻路段，而不是靠排除法蒙对 */
const SC_LEN = 8;

/* 某条线路上的全部情境题（末项没有「下一步」，所以只到倒数第二项） */
function scForRoute(ri){
  const a = routeItems(ROUTES[ri]).map(x => x.label);
  const out = [];
  for(let i = COMMON_HEAD; i < a.length - 1; i++){
    const nxt = a[i+1];
    const pool = [];
    a.forEach((x,j) => { if(j !== i && x !== nxt && !pool.includes(x)) pool.push(x); });
    if(pool.length < 3) continue;
    const opts = sh([nxt, ...sh(pool).slice(0,3)]);
    out.push({ ri, cue:a[i], opts, ans: opts.indexOf(nxt) });
  }
  return out;
}

/* 按线路分层抽样，避免某条线霸占整轮 */
function buildScenario(){
  const PER = Math.ceil(SC_LEN / ROUTES.length);
  const picked = [];
  ROUTES.forEach((r, ri) => picked.push(...sh(scForRoute(ri)).slice(0, PER)));
  return sh(picked);
}

function vScenario(){
  if(!S.sc || S.sc.model !== S.model)
    S.sc = { model:S.model, list:buildScenario(), i:0, ok:0, log:[] };
  const A = S.sc;
  if(!A.list.length) return `<div class="screen">
    <div class="nav"><div class="back" data-go="home">‹</div><div class="navtitle">情境判断</div></div>
    <div class="empty">当前车型下暂时出不了题。</div></div>`;
  if(A.i >= A.list.length) return vScenarioResult();

  const q = A.list[A.i], picked = A.log[A.i], done = picked !== undefined;
  const KEYS = ['A','B','C','D'];

  return `<div class="screen">
    <div class="nav"><div class="back" data-go="home">‹</div>
      <div><div class="navtitle">情境判断</div>
      <div class="navsub">第 ${A.i+1}/${A.list.length} 题 · ${MODEL_NAME[S.model]}</div></div>
      <div class="spacer"></div><div class="navsub" style="color:var(--accent)">✓ ${A.ok}</div></div>

    <div class="cue">
      <div class="who">${ROUTES[q.ri].name} · 语音播报</div>
      <div class="say">「${q.cue}」</div>
      ${CAN_SPEAK?`<button class="sbtn" data-say-cue="${A.i}">朗读播报</button>`:''}
    </div>

    <div class="ask">接下来这条线路上会播报什么？</div>
    ${q.opts.map((o,i)=>{
      let c=''; if(done){ if(i===q.ans) c='ok'; else if(i===picked) c='bad'; }
      return `<button class="opt ${c}" ${done?'disabled':''} data-sc="${i}">
        <span class="k">${KEYS[i]}</span><span>${o}</span></button>`;}).join('')}

    ${done?`<div class="expl ${picked===q.ans?'':'warn'}">${
      picked===q.ans ? '<b>答对了</b>' : '<b>应该是「'+q.opts[q.ans]+'」</b>'}｜
      在 ${ROUTES[q.ri].name} 上，「${q.cue}」之后就是「${q.opts[q.ans]}」。</div>
      <div class="btm"><button class="btn" data-act="scnext">${A.i+1<A.list.length?'下一题':'看成绩'}</button></div>`:''}
  </div>`;
}

function vScenarioResult(){
  const A = S.sc;
  const score = Math.round(A.ok / A.list.length * 100);
  return `<div class="screen">

    <div class="stat">
      <div class="s"><b style="color:var(--accent)">${A.ok}</b><span>答对</span></div>
      <div class="s"><b style="color:var(--red)">${A.list.length-A.ok}</b><span>答错</span></div>
    </div>
    <div class="btm"><button class="btn ghost" data-act="screset">再来一轮</button></div>
  </div>`;
}

/* ---------- 跨线路混合：给一段「线路指纹」，猜是哪条线 ---------- */
const MIX_WIN = 4;   // 片段长度

/* 只保留「独此一家」的连续片段。同一个片段若在别的线路也按同样顺序出现，
   这题就没有唯一答案——必须剔除，否则是在考用户猜出题人的心思。
   最后按线路分层抽样（每条最多 PER 题），避免最独特的那条线霸占整轮。 */
const MIX_PER = 2;
function buildMix(){
  const labels = ROUTES.map(r => routeItems(r).map(x => x.label));
  const byRoute = ROUTES.map(() => []);
  ROUTES.forEach((r, ri) => {
    const a = labels[ri];
    for(let i = COMMON_HEAD; i + MIX_WIN <= a.length; i++){
      const seg = a.slice(i, i + MIX_WIN), k = seg.join('|');
      let dup = false;
      for(let oi = 0; oi < labels.length && !dup; oi++){
        if(oi === ri) continue;
        const b = labels[oi];
        for(let j = 0; j + MIX_WIN <= b.length; j++)
          if(b.slice(j, j + MIX_WIN).join('|') === k){ dup = true; break; }
      }
      if(!dup) byRoute[ri].push({ ri, from:i, seg });
    }
  });
  const picked = [];
  byRoute.forEach(list => picked.push(...sh(list).slice(0, MIX_PER)));
  return sh(picked);
}
function segAt(ri, from){
  const b = routeItems(ROUTES[ri]).map(x => x.label);
  return (from + MIX_WIN <= b.length) ? b.slice(from, from + MIX_WIN) : null;
}

function vMix(){
  if(!S.mix || S.mix.model !== S.model)
    S.mix = { model:S.model, list:buildMix(), i:0, ok:0, log:[] };
  const X = S.mix;
  if(!X.list.length) return `<div class="screen">
    <div class="nav"><div class="back" data-go="home">‹</div><div class="navtitle">跨线路混合</div></div>
    <div class="empty">当前车型下各线路差异不足以出题。</div></div>`;
  if(X.i >= X.list.length) return vMixResult();

  const q = X.list[X.i], picked = X.log[X.i], done = picked !== undefined;
  const r = ROUTES[q.ri];
  const pos = `第 ${q.from+1}–${q.from+MIX_WIN} 步`;

  let feedback = '';
  if(done){
    if(picked === q.ri){
      feedback = `<div class="expl"><b>答对了</b>｜这段是 ${r.name} 的${pos}。</div>`;
    } else {
      const rv = segAt(picked, q.from);
      feedback = `<div class="expl warn"><b>是 ${r.name}</b>｜这段出现在它的${pos}。` +
        (rv ? `<div class="cmp"><div class="ct">对照 · ${ROUTES[picked].name} 在同一位置是：</div>
                 <div class="cv">${rv.join(' → ')}</div></div>` : '') +
        `</div>`;
    }
  }

  return `<div class="screen">
    <div class="nav"><div class="back" data-go="home">‹</div>
      <div><div class="navtitle">跨线路混合</div>
      <div class="navsub">第 ${X.i+1}/${X.list.length} 题 · ${MODEL_NAME[S.model]}</div></div>
      <div class="spacer"></div><div class="navsub" style="color:var(--accent)">✓ ${X.ok}</div></div>

    <div class="note" style="margin:0 0 12px">下面这串项目按这个顺序<b style="color:var(--accent)">只可能出现一条线路上</b>。想想是哪条？</div>

    <div class="segcard">
      ${q.seg.map((s,i)=>`${i?'<div class="segarr">↓</div>':''}<div class="segitem">${s}</div>`).join('')}
    </div>

    <div class="mixopts">${ROUTES.map((x,i)=>{
      let c=''; if(done){ if(i===q.ri) c='ok'; else if(i===picked) c='bad'; }
      return `<button class="mopt ${c}" ${done?'disabled':''} data-mix="${i}">${x.name}</button>`;}).join('')}</div>

    ${feedback}
    ${done?`<div class="btm"><button class="btn" data-act="mixnext">${X.i+1<X.list.length?'下一题':'看成绩'}</button></div>`:''}
  </div>`;
}

function vMixResult(){
  const X = S.mix;
  const score = Math.round(X.ok / X.list.length * 100);
  return `<div class="screen">
    <div class="nav"><div class="back" data-go="home">‹</div><div class="navtitle">跨线路混合 · 成绩</div></div>
    <div class="score"><div class="big">${score}</div>
      <div class="lab">${X.ok===X.list.length?'全部认对，线路已经分得清了':'分不清的地方，正是要练的地方'}</div></div>
    <div class="stat">
      <div class="s"><b style="color:var(--accent)">${X.ok}</b><span>答对</span></div>
      <div class="s"><b style="color:var(--red)">${X.list.length-X.ok}</b><span>答错</span></div>
    </div>
    <div class="btm"><button class="btn ghost" data-act="mixreset">再来一轮</button></div>
  </div>`;
}

/* ---------- 整场模拟：随机一条线，按真实顺序走一遍 ---------- */
const EX_STAGES = ['夜间灯光', '路线顺序', '情境判断'];
const EX_LIGHT = 5, EX_SC = 4;
const EX_W = [30, 40, 30];          // 三段分值，合计 100

function newExam(){
  const ri = Math.floor(Math.random() * ROUTES.length);
  return {
    ri, phase: 0,
    light: { set: sh(LIGHTS).slice(0, EX_LIGHT), i:0, ok:0, log:[] },
    order: null,
    sc: { list: sh(scForRoute(ri)).slice(0, EX_SC), i:0, ok:0, log:[] }
  };
}
function exNav(title, sub){
  return `<div class="nav"><div class="back" data-go="home">‹</div>
    <div><div class="navtitle">${title}</div><div class="navsub">${sub}</div></div></div>`;
}
function exBar(E){
  return `<div class="exbar">${EX_STAGES.map((s,i)=>
    `<div class="exs ${i<E.phase?'done':i===E.phase?'on':''}"><b>${i+1}</b>${s}</div>`).join('')}</div>`;
}
/* 三段得分（导出供测试直接断言） */
function examScores(E){
  const lN = E.light.set.length, oQ = E.order;
  const oN = oQ ? oQ.items.length : 0;
  const oOk = oQ ? oQ.ans.filter((p,i)=>p===i).length : 0;
  const sN = E.sc.list.length;
  return {
    light: Math.round((lN ? E.light.ok/lN : 0) * EX_W[0]),
    order: Math.round((oN ? oOk/oN : 0) * EX_W[1]),
    sc:    Math.round((sN ? E.sc.ok/sN : 0) * EX_W[2]),
    detail: { lOk:E.light.ok, lN, oOk, oN, sOk:E.sc.ok, sN }
  };
}

function vExam(){
  if(!S.exam) S.exam = newExam();
  const E = S.exam;
  if(E.phase >= EX_STAGES.length) return vExamResult();
  const r = ROUTES[E.ri];

  /* 阶段 1 · 夜间灯光 */
  if(E.phase === 0){
    const L = E.light, q = L.set[L.i], p = L.log[L.i];
    return `<div class="screen">
      ${exNav('整场模拟 · 灯光', `${r.name} · 第 ${L.i+1}/${L.set.length} 题`)}
      ${exBar(E)}
      <div class="voice"><div class="txt">「${q[0]}」</div><div class="hint">语音播报 · 3 秒内操作</div>
        ${CAN_SPEAK?`<button class="sbtn" data-say-exl="${L.i}">朗读播报</button>`:''}</div>
      <div class="lpanel">${OPS.map(o=>{
        let c=''; if(p){ if(o===q[1]) c='ok'; else if(o===p.o) c='bad'; }
        return `<button class="lbtn ${c}" ${p?'disabled':''} data-exl="${o}">${o}</button>`;}).join('')}</div>
      ${p?`<div class="expl ${p.o===q[1]?'':'warn'}">${p.o===q[1]?'<b>选对了</b>':'<b>应选 '+q[1]+'</b>'}｜${q[2]}</div>
        <div class="btm"><button class="btn" data-act="exnext">${L.i+1<L.set.length?'下一题':'进入路线顺序'}</button></div>`:''}
    </div>`;
  }

  /* 阶段 2 · 路线顺序（整条） */
  if(E.phase === 1){
    const items = routeItems(r);
    if(!E.order) E.order = { items, pool: sh(items.map((_,i)=>i)), ans:[], judged:false };
    const q = E.order, done = q.judged;
    const pool = q.pool.filter(p=>!q.ans.includes(p));
    const okN = q.ans.filter((p,i)=>p===i).length;
    const rows = q.ans.length ? q.ans.map((p,i)=>{
      const ok = done && p===i;
      return `<div class="arow ${done?(ok?'ok':'bad'):''}" data-exun="${p}">
        <div class="n">${done?(ok?'✓':'✕'):i+1}</div><div>${q.items[p].label}</div>
        ${done&&!ok?`<div class="fix">应为 ${q.items[i].label}</div>`:(done?'':'<div class="x">✕</div>')}</div>`;
    }).join('') : `<div class="empty">按顺序点选上方项目</div>`;

    return `<div class="screen">
      ${exNav('整场模拟 · 顺序', `${r.name} · 共 ${items.length} 项`)}
      ${exBar(E)}
      ${!done?`<div class="poolstick">
        <div class="prog"><div class="bar"><i style="width:${q.ans.length/q.items.length*100}%"></i></div><span>${q.ans.length}/${q.items.length}</span></div>
        <div class="lbl" style="margin-bottom:7px">待选 ${pool.length}</div>
        <div class="pool">${sh(pool).map(p=>`<div class="chip" data-exp="${p}">${q.items[p].label}</div>`).join('')}</div>
      </div>`:''}
      <div class="lbl" style="margin-top:${done?'0':'10px'}">${done?'对照':'你的顺序'}</div>
      <div class="applied">${rows}</div>
      <div class="btm">${done
        ? `<button class="btn" data-act="exnext">进入情境判断</button>`
        : `<button class="btn" ${q.ans.length!==q.items.length?'disabled':''} data-act="exsubmit">${q.ans.length!==q.items.length?`还差 ${q.items.length-q.ans.length} 项`:'提交'}</button>`}</div>
    </div>`;
  }

  /* 阶段 3 · 情境判断 */
  const A = E.sc, q = A.list[A.i], picked = A.log[A.i], done = picked !== undefined;
  const KEYS = ['A','B','C','D'];
  return `<div class="screen">
    ${exNav('整场模拟 · 情境', `${r.name} · 第 ${A.i+1}/${A.list.length} 题`)}
    ${exBar(E)}
    <div class="cue"><div class="who">${r.name} · 语音播报</div><div class="say">「${q.cue}」</div>
      ${CAN_SPEAK?`<button class="sbtn" data-say-exs="${A.i}">朗读播报</button>`:''}</div>
    <div class="ask">接下来这条线路上会播报什么？</div>
    ${q.opts.map((o,i)=>{
      let c=''; if(done){ if(i===q.ans) c='ok'; else if(i===picked) c='bad'; }
      return `<button class="opt ${c}" ${done?'disabled':''} data-exsc="${i}">
        <span class="k">${KEYS[i]}</span><span>${o}</span></button>`;}).join('')}
    ${done?`<div class="expl ${picked===q.ans?'':'warn'}">${picked===q.ans?'<b>答对了</b>':'<b>应该是「'+q.opts[q.ans]+'」</b>'}</div>
      <div class="btm"><button class="btn" data-act="exnext">${A.i+1<A.list.length?'下一题':'看总成绩'}</button></div>`:''}
  </div>`;
}

function vExamResult(){
  const E = S.exam, r = ROUTES[E.ri], S3 = examScores(E);
  const total = S3.light + S3.order + S3.sc;
  const pass = total >= 90;
  const rows = [['夜间灯光', S3.light, EX_W[0], `${S3.detail.lOk}/${S3.detail.lN} 题`],
                ['路线顺序', S3.order, EX_W[1], `${S3.detail.oOk}/${S3.detail.oN} 项`],
                ['情境判断', S3.sc,    EX_W[2], `${S3.detail.sOk}/${S3.detail.sN} 题`]];
  return `<div class="screen">
    <div class="nav"><div class="back" data-go="home">‹</div><div class="navtitle">整场模拟 · 成绩</div></div>
    <div class="score"><div class="big" style="color:${pass?'var(--accent)':'var(--warn)'}">${total}</div>
      <div class="lab">${r.name} · ${pass?'90 分以上，按合格线算是过了':'还差一点，看下面哪一段拖后腿'}</div></div>
    <div class="sechead">分项得分</div>
    <div class="card">
      ${rows.map(([n,v,max,d])=>{
        const pct = max ? Math.round(v/max*100) : 0;
        return `<div class="mline"><div class="mhead"><span>${n}</span>
          <span style="color:${pct>=90?'var(--accent)':pct>=60?'var(--warn)':'var(--red)'}">${v}/${max} · ${d}</span></div>
          <div class="prog" style="margin-bottom:0"><div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
      }).join('')}
    </div>
    <div class="note">模拟按真实考试顺序串起来：灯光 → 上路 → 情境。正式考试满分 100、<b>90 分合格</b>。</div>
    <div class="btm"><div class="btnrow">
      <button class="btn ghost" data-go="home">返回首页</button>
      <button class="btn" data-act="exreset">再考一次</button></div></div>
  </div>`;
}

/* 顺序题提交后的统计与错题记录（抽成独立函数便于测试） */
function recordOrderResult(){
  const q=S.Q;
  const okN=q.ans.filter((p,i)=>p===i).length;
  const rate=Math.round(okN/q.items.length*100);
  const rid=ROUTES[S.r].id;
  const st=S.stats[rid]||(S.stats[rid]={runs:0,best:0});
  st.runs++; if(rate>st.best) st.best=rate;     // 掌握度取最好一次
  S.total++;
  recordOrderMistakes(q.items, ROUTES[S.r].name, q.ans);
}
/* 只记「错在哪一步」，不记用户当时填了什么 —— 重练要考的是正确顺序 */
function recordOrderMistakes(items, group, ans){
  const labels = items.map(x => x.label);
  labels.forEach((lab, i) => {
    if(ans[i] !== i) addMistake(stepMistake(labels, i, group, S.model));
  });
}

    const a=el.dataset.act;
    if(a==='submit'){ S.Q.judged=true; recordOrderResult(); }
    if(a==='seen') S.seen=true;
    if(a==='redo') S.Q=newQ(routeItems(ROUTES[S.r]));
    if(a==='ssubmit'){
      const t=SPECIAL[S.model][S.sp], q=S.sq; q.judged=true;
      q.ans.forEach((p,i)=>{ if(p!==i) addMistake(stepMistake(t.steps, i, t.t, S.model)); });
    }
    if(a==='sredo') S.sq=null;
    if(a==='mixnext') S.mix.i++;
    if(a==='mixreset') S.mix=null;
    if(a==='scnext') S.sc.i++;
    if(a==='screset') S.sc=null;
    if(a==='exsubmit'){
      const q=S.exam.order; q.judged=true;
      recordOrderMistakes(q.items, ROUTES[S.exam.ri].name, q.ans);
    }
    if(a==='exnext'){
      const E=S.exam;
      if(E.phase===0){ E.light.i++; if(E.light.i >= E.light.set.length) E.phase=1; }
      else if(E.phase===1){ E.phase=2; }
      else if(E.phase===2){ E.sc.i++; if(E.sc.i >= E.sc.list.length) E.phase=3; }
    }
    if(a==='exreset') S.exam=null;
    if(a==='rvnext') S.rv.i++;
    if(a==='rvreset') S.rv=null;
    if(a==='lnext') S.L.i++;
    if(a==='lreset') S.L=null;
    render();
  });
}
load();
render();
</script>
